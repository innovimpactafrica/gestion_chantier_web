events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # index.html ne doit JAMAIS être mis en cache : c'est lui qui référence
        # les fichiers JS/CSS hashés. À chaque déploiement il doit être rechargé.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Assets hashés (main-A3F2B1.js, etc.) : le nom change à chaque build,
        # donc on peut les mettre en cache "immutable" sans risque.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /health {
            return 200 "healthy\n";
        }
    }
}