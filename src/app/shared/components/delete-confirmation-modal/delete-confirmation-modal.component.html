<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fadeIn" (click)="onBackdropClick($event)">
  <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm"></div>
  
  <div class="relative bg-white rounded-xl shadow-2xl max-w-md w-full animate-scaleIn">
    <div class="p-6">
      <div class="flex items-start gap-4">
        <div class="flex-shrink-0 w-12 h-12 rounded-full bg-red-100 flex items-center justify-center">
          <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        
        <div class="flex-1 min-w-0">
          <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ title }}</h3>
          <p class="text-sm text-gray-600">{{ message }}</p>
        </div>
      </div>
    </div>
    
    <div class="bg-gray-50 px-6 py-4 rounded-b-xl flex gap-3 justify-end">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading"
        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-100 disabled:bg-gray-200 disabled:cursor-not-allowed transition-all"
      >
        {{ cancelText }}
      </button>
      
      <button
        type="button"
        (click)="onConfirm()"
        [disabled]="isLoading"
        class="px-4 py-2 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 disabled:bg-red-400 disabled:cursor-not-allowed transition-all flex items-center gap-2"
      >
        <svg *ngIf="isLoading" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        {{ isLoading ? 'Suppression...' : confirmText }}
      </button>
    </div>
  </div>
</div>
