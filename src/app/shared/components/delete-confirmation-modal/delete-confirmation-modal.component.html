<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white w-full max-w-sm rounded-2xl shadow-lg p-6" (click)="$event.stopPropagation()">
    <div class="text-center">

      <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-red-100 mb-4">
        <svg class="h-7 w-7 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>

      <h3 class="text-lg font-bold text-gray-900 mb-2">{{ title }}</h3>
      <p class="text-gray-600 text-sm mb-6">{{ message }}</p>

      <div class="flex gap-3">
        <button type="button" (click)="onCancel()" [disabled]="isLoading"
          class="flex-1 py-2.5 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 font-medium transition disabled:opacity-50">
          {{ cancelText }}
        </button>
        <button type="button" (click)="onConfirm()" [disabled]="isLoading"
          class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition disabled:opacity-50 flex items-center justify-center gap-2">
          <span *ngIf="isLoading" class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
          {{ isLoading ? 'Suppression...' : confirmText }}
        </button>
      </div>

    </div>
  </div>
</div>
