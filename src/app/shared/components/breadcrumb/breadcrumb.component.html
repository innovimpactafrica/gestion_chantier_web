<div class="container mx-auto flex justify-between items-center mb-4">
  <nav class="flex items-center space-x-2 text-gray-600">
    <ng-container *ngFor="let item of breadcrumbs; let last = last">
      <a *ngIf="!last" [routerLink]="item.path" class="hover:text-gray-800 text-[#FF5C02]">
        {{ item.label }}
      </a>
      <!-- <span *ngIf="last" class="font-medium text-[#777777]">{{ item.label }}</span> -->
      <svg *ngIf="!last" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20"
        fill="currentColor">
        <path fill-rule="evenodd"
          d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
          clip-rule="evenodd" />
      </svg>
    </ng-container>
  </nav>

  <div class="flex items-center">
    <button (click)="openHelpModal()" class="flex items-center space-x-2 p-2 hover:opacity-80 transition-opacity">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2.25C6.615 2.25 2.25 6.615 2.25 12C2.25 17.385 6.615 21.75 12 21.75C17.385 21.75 21.75 17.385 21.75 12C21.75 6.615 17.385 2.25 12 2.25ZM12 14.747C12.1989 14.747 12.3897 14.826 12.5303 14.9667C12.671 15.1073 12.75 15.2981 12.75 15.497V15.997C12.75 16.1959 12.671 16.3867 12.5303 16.5273C12.3897 16.668 12.1989 16.747 12 16.747C11.8011 16.747 11.6103 16.668 11.4697 16.5273C11.329 16.3867 11.25 16.1959 11.25 15.997V15.497C11.25 15.2981 11.329 15.1073 11.4697 14.9667C11.6103 14.826 11.8011 14.747 12 14.747ZM13.872 7.933C14.416 8.415 14.75 9.121 14.75 9.99C14.75 10.63 14.586 11.128 14.3 11.533C14.044 11.898 13.712 12.147 13.477 12.323L13.45 12.343C13.187 12.541 13.034 12.663 12.926 12.817C12.836 12.944 12.75 13.134 12.75 13.497C12.75 13.6959 12.671 13.8867 12.5303 14.0273C12.3897 14.168 12.1989 14.247 12 14.247C11.8011 14.247 11.6103 14.168 11.4697 14.0273C11.329 13.8867 11.25 13.6959 11.25 13.497C11.25 12.857 11.414 12.357 11.7 11.953C11.956 11.589 12.288 11.34 12.523 11.163L12.55 11.143C12.813 10.945 12.966 10.823 13.074 10.669C13.164 10.542 13.25 10.352 13.25 9.99C13.25 9.53 13.084 9.24 12.878 9.056C12.6322 8.85025 12.3205 8.74016 12 8.746C11.66 8.746 11.343 8.86 11.123 9.056C10.916 9.239 10.75 9.53 10.75 9.99C10.75 10.1889 10.671 10.3797 10.5303 10.5203C10.3897 10.661 10.1989 10.74 10 10.74C9.80109 10.74 9.61032 10.661 9.46967 10.5203C9.32902 10.3797 9.25 10.1889 9.25 9.99C9.25 9.121 9.584 8.415 10.127 7.933C10.6472 7.48423 11.313 7.24005 12 7.246C12.66 7.246 13.343 7.464 13.872 7.933Z" fill="#FF5C02"/>
</svg>

      <div class="text-left">
        <div class="font-bold text-[#FF5C02] text-sm">Aide & Support</div>
      </div>
    </button>
  </div>

  <!-- Modal Aide & Support -->
  <div *ngIf="showHelpModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
    (click)="closeHelpModal()">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full animate-in" (click)="$event.stopPropagation()">
      <!-- Header -->
      <div
        class="bg-gradient-to-r from-orange-500 to-orange-600 px-6 py-4 flex items-center justify-between rounded-t-lg">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
            </path>
          </svg>
          Aide & Support
        </h2>
        <button (click)="closeHelpModal()" class="text-white hover:text-gray-200 transition-colors">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Content -->
      <div class="p-6 space-y-6">
        <!-- Description -->
        <p class="text-gray-600 text-sm">Contactez-nous pour toute question ou assistance. Nous sommes là pour vous
          aider!</p>

        <!-- Email Contact -->
        <div class="border border-gray-200 rounded-lg p-4 hover:border-orange-300 transition-colors">
          <div class="flex items-center justify-between mb-2">
            <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
              <svg class="w-5 h-5 text-orange-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              Email
            </label>
          </div>
          <div class="flex items-center justify-between bg-gray-50 p-3 rounded">
            <span class="text-gray-900 font-medium">{{ emailAddress }}</span>
            <button (click)="copyToClipboard(emailAddress)"
              class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded text-xs font-medium transition-colors flex items-center gap-1">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                </path>
              </svg>
              Copier
            </button>
          </div>
        </div>

        <!-- Phone Contact -->
        <div class="border border-gray-200 rounded-lg p-4 hover:border-orange-300 transition-colors">
          <div class="flex items-center justify-between mb-2">
            <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
              <svg class="w-5 h-5 text-orange-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
              Téléphone
            </label>
          </div>
          <div class="flex items-center justify-between bg-gray-50 p-3 rounded">
            <span class="text-gray-900 font-medium">{{ phoneNumber }}</span>
            <button (click)="copyToClipboard(phoneNumber)"
              class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded text-xs font-medium transition-colors flex items-center gap-1">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                </path>
              </svg>
              Copier
            </button>
          </div>
        </div>

        <!-- Hours -->
        <div class="bg-orange-50 border border-orange-200 rounded-lg p-4">
          <p class="text-sm text-orange-900">
            <span class="font-semibold">Heures de support:</span> Lundi - Vendredi, 08:00 - 18:00
          </p>
        </div>
      </div>

      <!-- Footer -->
      <div class="border-t border-gray-200 px-6 py-4 bg-gray-50 rounded-b-lg">
        <button (click)="closeHelpModal()"
          class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg font-medium transition-colors">
          Fermer
        </button>
      </div>
    </div>
  </div>
</div>
