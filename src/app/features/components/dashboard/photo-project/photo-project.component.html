<!-- Photos récentes -->
<div class="p-4 bg-white rounded-lg shadow-sm max-w-md mx-auto h-[305px]">
  <div class="flex justify-between items-center mb-2">
    <h2 class="text-lg font-medium text-gray-700">Photos récentes</h2>
  </div>

  <!-- Affichage conditionnel : photos dynamiques ou message vide -->
  <div *ngIf="photos && photos.length > 0; else noPhotos" class="grid grid-cols-3 gap-2">
    <div *ngFor="let photo of photos; let i = index"
      class="relative w-[100px] h-24 shadow-lg rounded-[10px] cursor-pointer group overflow-hidden"
      (click)="openModal(i)">
      <img [src]="photo.photo || photo.url"
        class="rounded-[10px] w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
        [alt]="photo.titre || 'Photo de projet'" (error)="onImageError($event)">

      <!-- Hover overlay with enlarge icon -->
      <div
        class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-40 transition-all duration-300 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8 text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
        </svg>
      </div>

      <!-- Overlay with titre and date (affiché seulement si titre existe) -->
      <div *ngIf="photo.titre"
        class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-60 text-white rounded-b-[10px] p-2">
        <div class="text-xs text-end font-medium">{{ photo.titre }}</div>
        <div class="text-xs">{{ photo.date | date:'dd/MM/yyyy' }}</div>
      </div>

      <!-- Overlay simple pour les photos sans titre -->
      <div *ngIf="!photo.titre"
        class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-40 text-white rounded-b-[10px] p-1">
        <div class="text-xs">{{ photo.date | date:'dd/MM/yyyy' }}</div>
      </div>
    </div>
  </div>

  <!-- Template alternatif quand aucune photo -->
  <ng-template #noPhotos>
    <div class="flex flex-col items-center justify-center h-48 text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <p class="text-sm">Aucune photo récente</p>
    </div>
  </ng-template>
</div>

<!-- Full-screen Modal -->
<div *ngIf="showModal && currentPhoto" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center p-4"
  style="z-index: 50;" (click)="handleBackdropClick($event)" (keydown)="handleKeydown($event)" tabindex="0">

  <!-- Close button -->
  <button (click)="closeModal()" class="absolute top-4 right-4 text-white hover:text-gray-300 transition-colors z-10">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Previous button -->
  <button *ngIf="photos.length > 1" (click)="previousPhoto(); $event.stopPropagation()"
    class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white hover:text-gray-300 transition-colors bg-black bg-opacity-50 rounded-full p-3 z-10">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
  </button>

  <!-- Image container -->
  <div class="max-w-5xl max-h-[90vh] flex flex-col items-center">
    <img [src]="currentPhoto.photo || currentPhoto.url" [alt]="currentPhoto.titre || 'Photo de projet'"
      class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl" (error)="onImageError($event)">

    <!-- Photo info -->
    <div class="mt-4 text-center text-white">
      <h3 *ngIf="currentPhoto.titre" class="text-xl font-semibold">{{ currentPhoto.titre }}</h3>
      <p class="text-sm text-gray-300 mt-1">{{ currentPhoto.date | date:'dd/MM/yyyy' }}</p>
      <p class="text-xs text-gray-400 mt-2">{{ currentPhotoIndex + 1 }} / {{ photos.length }}</p>
    </div>
  </div>

  <!-- Next button -->
  <button *ngIf="photos.length > 1" (click)="nextPhoto(); $event.stopPropagation()"
    class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white hover:text-gray-300 transition-colors bg-black bg-opacity-50 rounded-full p-3 z-10">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </button>
</div>
