<!-- progress-report.component.html -->
<div class="bg-white rounded-lg shadow-sm p-6 w-full">

  <!-- Chargement -->
  <div *ngIf="isLoading" class="flex items-center justify-center h-64">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-500"></div>
  </div>

  <!-- Aucune donnée -->
  <div *ngIf="!isLoading && !hasData" class="flex flex-col items-center justify-center h-64 text-gray-400">
    <svg class="w-10 h-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
    </svg>
    <p class="text-sm">Aucune donnée d'avancement disponible</p>
  </div>

  <!-- Graphique en anneau + légende dynamique -->
  <div *ngIf="!isLoading && hasData" class="flex flex-col sm:flex-row items-center gap-6">
    <div class="relative h-56 w-56 flex-shrink-0 mx-auto sm:mx-0">
      <canvas #barChart></canvas>
    </div>

    <!-- Légende personnalisée : couleur + libellé + pourcentage -->
    <div class="flex-1 w-full space-y-3">
      <div *ngFor="let item of progressData" class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="h-3 w-3 rounded-full flex-shrink-0" [style.background-color]="item.color"></span>
          <span class="text-sm text-gray-700 truncate">{{ item.label }}</span>
        </div>
        <span class="text-sm font-semibold text-gray-900 flex-shrink-0">{{ formatPercentage(item.value) }}</span>
      </div>
    </div>
  </div>

  <!-- Erreur (données par défaut affichées en fallback) -->
  <p *ngIf="error" class="text-xs text-gray-400 mt-3 text-center">{{ error }}</p>
</div>
