<div [class]="selectedPropertyId ? 'bg-white p-4 sm:p-6' : 'bg-white min-h-screen p-4 sm:p-6'">

  <!-- ══════════════════════════ EN-TÊTE (même design que Jalons de chantier) ══════════════════════════ -->

      <div class="flex items-center gap-3">

          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-gray-900">Gestion des salaires</h1>
          <p class="text-sm text-gray-500">Profils salariaux, périodes de paie, bulletins, acomptes et paiements</p>
        </div>
      </div>

      <select id="salaire-property-select" [(ngModel)]="selectedPropertyId" (ngModelChange)="onPropertyChange()"
        [disabled]="loadingProperties"
        class="border border-gray-200 rounded-full py-2.5 px-4 text-sm font-medium text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 min-w-[220px]">
        <option [ngValue]="null">-- Sélectionner un chantier --</option>
        <option *ngFor="let property of properties" [ngValue]="property.id">{{ property.title }}</option>
      </select>
    </div>
  </div>

  <!-- ══════════════════════════ ÉTAT VIDE : AUCUN CHANTIER SÉLECTIONNÉ ══════════════════════════ -->
  <div *ngIf="!selectedPropertyId" class="border-2 border-dashed border-gray-200 rounded-2xl bg-white py-20 px-4 flex flex-col items-center text-center">
    <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mb-5">
      <svg class="w-9 h-9 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 9v1m9-5a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <h2 class="text-lg font-bold text-gray-900 mb-2">Aucun chantier sélectionné</h2>
    <p class="text-sm text-gray-400 max-w-sm mb-6">
      Sélectionnez un chantier dans la liste ci-dessus pour gérer ses salaires.
    </p>
    <button (click)="openPropertySelector()"
      class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm">
      Sélectionner un chantier
    </button>
  </div>
</div>

<!-- Monté en dehors du conteneur ci-dessus : ce composant gère déjà son propre fond blanc / padding -->
<app-gestion-salaire *ngIf="selectedPropertyId"></app-gestion-salaire>
