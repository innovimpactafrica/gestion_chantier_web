<div [class]="selectedPropertyId ? 'bg-white p-4 sm:p-6' : 'bg-white min-h-screen p-4 sm:p-6'">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-5 mb-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-gray-900">Finance chantier</h1>
        <p class="text-sm text-gray-500">Budget prévu, dépenses engagées et budget restant</p>
      </div>
      <select [(ngModel)]="selectedPropertyId" (ngModelChange)="onPropertyChange()"
        [disabled]="loadingProperties"
        class="border border-gray-200 rounded-full py-2.5 px-4 text-sm font-medium text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 min-w-[220px]">
        <option [ngValue]="null">-- Sélectionner un chantier --</option>
        <option *ngFor="let property of properties" [ngValue]="property.id">{{ property.title }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="!selectedPropertyId" class="border-2 border-dashed border-gray-200 rounded-2xl bg-white py-20 px-4 flex flex-col items-center text-center">
    <h2 class="text-lg font-bold text-gray-900 mb-2">Aucun chantier sélectionné</h2>
    <p class="text-sm text-gray-400 max-w-sm">Sélectionnez un chantier pour consulter son budget et ses dépenses.</p>
  </div>
</div>

<app-project-budget *ngIf="selectedPropertyId"></app-project-budget>
